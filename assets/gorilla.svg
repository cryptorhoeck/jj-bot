<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>
  <!-- Gorilla side profile silhouette -->
  <g fill="#ffffff">
    <!-- Head and face -->
    <path d="M85 65
             C75 65 65 75 60 90
             C55 105 55 115 58 125
             C60 130 62 135 65 140
             C68 145 72 150 78 155
             L78 165
             C78 175 82 182 90 185
             C95 187 102 188 110 188
             C118 188 125 186 130 182
             C135 178 138 172 140 165
             L140 155
             C148 150 155 142 160 132
             C165 122 168 110 168 98
             C168 85 162 74 152 67
             C142 60 130 58 118 58
             C105 58 95 60 85 65Z"/>
    <!-- Brow ridge -->
    <ellipse cx="115" cy="85" rx="35" ry="12" fill="#e0e0e0" opacity="0.3"/>
    <!-- Eye -->
    <circle cx="125" cy="95" r="8" fill="#1e1e2e"/>
    <circle cx="127" cy="93" r="3" fill="#ffffff"/>
    <!-- Nostril -->
    <ellipse cx="148" cy="125" rx="4" ry="6" fill="#1e1e2e"/>
    <!-- Ear -->
    <ellipse cx="72" cy="100" rx="12" ry="18" fill="#d0d0d0" opacity="0.4"/>
    <!-- Shoulder/body hint -->
    <path d="M78 185
             C70 190 62 200 58 215
             C55 225 55 235 60 245
             L180 245
             C175 230 165 215 150 200
             C140 190 130 185 118 185
             C105 185 90 185 78 185Z" opacity="0.7"/>
  </g>
  <!-- Subtle chart line overlay -->
  <path d="M30 200 L70 180 L110 190 L150 160 L190 170 L230 140"
        stroke="#ffffff" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/>
</svg>
