name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black isort flake8 mypy bandit

    - name: Run Black (code formatting check)
      run: black --check --line-length=100 .

    - name: Run isort (import sorting check)
      run: isort --check-only --profile=black --line-length=100 .

    - name: Run flake8 (linting)
      run: |
        flake8 . --count --max-line-length=100 \
          --extend-ignore=E203,E501,W503 \
          --exclude=.git,__pycache__,build,dist,venv,env,node_modules,frontend \
          --statistics

    - name: Run mypy (type checking)
      run: mypy glue services modules --ignore-missing-imports || true

    - name: Run bandit (security check)
      run: bandit -r glue services modules -ll || true

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create data directories
      run: |
        mkdir -p data logs backups

    - name: Run pytest
      run: |
        pytest tests/ -v --cov=glue --cov=services --cov=modules \
          --cov-report=xml --cov-report=html --cov-report=term-missing \
          --junit-xml=test-results.xml || true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          test-results.xml
          htmlcov/

  build:
    name: Build Application
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create data directories
      run: |
        mkdir -p data logs backups

    - name: Test API startup
      run: |
        timeout 10s python glue/api/main.py || true
      shell: bash

    - name: Build with PyInstaller (if available)
      run: |
        pip install pyinstaller
        # Add PyInstaller build commands here when ready
      continue-on-error: true

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Build frontend
      working-directory: frontend
      run: npm run build

    - name: Run frontend tests
      working-directory: frontend
      run: npm test || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-dist
        path: frontend/dist/

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test, build]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create data directories
      run: |
        mkdir -p data logs backups

    - name: Run API server in background
      run: |
        python glue/api/main.py &
        sleep 5
      env:
        LOG_LEVEL: INFO

    - name: Test API endpoints
      run: |
        curl -f http://127.0.0.1:8000/ || exit 1
        curl -f http://127.0.0.1:8000/api/summary || exit 1
        curl -f http://127.0.0.1:8000/api/system/health || exit 1

    - name: Stop API server
      run: |
        pkill -f "python glue/api/main.py" || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint, test, build, frontend, integration, security]
    if: always()

    steps:
    - name: Check job status
      run: |
        echo "Lint: ${{ needs.lint.result }}"
        echo "Test: ${{ needs.test.result }}"
        echo "Build: ${{ needs.build.result }}"
        echo "Frontend: ${{ needs.frontend.result }}"
        echo "Integration: ${{ needs.integration.result }}"
        echo "Security: ${{ needs.security.result }}"
