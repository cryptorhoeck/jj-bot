{% extends "base.html" %}
{% block content %}
<div x-data="backupManager()" class="space-y-6">
    <!-- Create Backup Section -->
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-2xl font-bold mb-4">Create New Backup</h2>
        <div class="flex gap-4">
            <input 
                x-model="newBackupReason" 
                type="text" 
                placeholder="Reason for backup..." 
                class="flex-1 border rounded px-3 py-2"
            >
            <button 
                @click="createBackup()" 
                :disabled="!newBackupReason"
                class="btn-primary"
                :class="{'opacity-50': !newBackupReason}"
            >
                Create Backup
            </button>
        </div>
    </div>

    <!-- Backup List -->
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-2xl font-bold">System Snapshots</h2>
            <button @click="loadBackups()" class="btn-secondary">
                <i class="fas fa-sync"></i> Refresh
            </button>
        </div>

        <div x-show="loading" class="text-center py-4">
            Loading backups...
        </div>

        <div x-show="!loading && backups.length === 0" class="text-center py-8 text-gray-500">
            No backups found
        </div>

        <div x-show="!loading && backups.length > 0" class="space-y-3">
            <template x-for="backup in backups" :key="backup.name">
                <div class="border rounded p-4 hover:bg-gray-50">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="font-semibold" x-text="backup.name"></h3>
                            <p class="text-sm text-gray-600" x-text="backup.reason || 'No reason provided'"></p>
                            <div class="text-xs text-gray-500 mt-1">
                                <span x-text="backup.created || backup.modified"></span>
                                <span x-show="backup.size"> | <span x-text="formatSize(backup.size)"></span></span>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button 
                                @click="restoreBackup(backup.name)" 
                                class="px-3 py-1 bg-blue-600 text-white rounded text-sm hover:bg-blue-700"
                            >
                                Restore
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function backupManager() {
    return {
        backups: [],
        loading: false,
        newBackupReason: '',

        async init() {
            await this.loadBackups();
        },

        async loadBackups() {
            this.loading = true;
            try {
                const response = await fetch('/api/backups/list');
                const data = await response.json();
                this.backups = data.backups || [];
            } catch (error) {
                alert('Error loading backups: ' + error.message);
            } finally {
                this.loading = false;
            }
        },

        async createBackup() {
            if (!this.newBackupReason) return;
            
            try {
                const response = await fetch('/api/backup/create', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `reason=${encodeURIComponent(this.newBackupReason)}`
                });
                const result = await response.json();
                
                if (result.success) {
                    this.newBackupReason = '';
                    await this.loadBackups();
                    alert('Backup created successfully!');
                } else {
                    alert('Backup failed: ' + result.message);
                }
            } catch (error) {
                alert('Error creating backup: ' + error.message);
            }
        },

        async restoreBackup(snapshotName) {
            if (!confirm(`Restore system from backup: ${snapshotName}?\n\nThis will replace current files with the backup version.`)) {
                return;
            }
            
            try {
                const response = await fetch('/api/backup/restore', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: `snapshot_name=${encodeURIComponent(snapshotName)}`
                });
                const result = await response.json();
                
                if (result.success) {
                    alert('System restored successfully! Restarting services...');
                    // Trigger API restart
                    await fetch('/api/service/restart', {method: 'POST'});
                    setTimeout(() => location.reload(), 3000);
                } else {
                    alert('Restore failed: ' + result.message);
                }
            } catch (error) {
                alert('Error restoring backup: ' + error.message);
            }
        },

        formatSize(bytes) {
            const sizes = ['B', 'KB', 'MB', 'GB'];
            if (bytes === 0) return '0 B';
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }
    }
}
</script>
{% endblock %}
