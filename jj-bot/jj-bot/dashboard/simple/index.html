<!DOCTYPE html>
<html>
<head>
    <title>JJ-Bot Simple Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }
        .card h3 { margin: 0 0 10px 0; color: #333; }
        .value { font-size: 24px; font-weight: bold; margin: 10px 0; }
        .positive { color: #10b981; }
        .negative { color: #ef4444; }
        .neutral { color: #6b7280; }
        .trades-table { background: white; border-radius: 12px; padding: 20px; overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .table th { background: #f9fafb; font-weight: 600; }
        .signal-long { color: #10b981; font-weight: bold; }
        .signal-short { color: #ef4444; font-weight: bold; }
        .status { padding: 10px; border-radius: 8px; margin: 10px 0; }
        .status.success { background: #d1fae5; color: #065f46; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .refresh-btn { 
            background: #4f46e5; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 14px;
        }
        .refresh-btn:hover { background: #4338ca; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦍 JJ Gorilla Trading Dashboard</h1>
            <p>Simple & Reliable Version</p>
            <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
        </div>
        
        <div id="status" class="status"></div>
        
        <div class="cards">
            <div class="card">
                <h3>💰 Account Value</h3>
                <div class="value neutral" id="account-value">Loading...</div>
            </div>
            <div class="card">
                <h3>📈 Total Trades</h3>
                <div class="value neutral" id="total-trades">Loading...</div>
            </div>
            <div class="card">
                <h3>💹 Total P&L</h3>
                <div class="value neutral" id="total-pnl">Loading...</div>
            </div>
            <div class="card">
                <h3>🎯 Win Rate</h3>
                <div class="value neutral" id="win-rate">Loading...</div>
            </div>
        </div>
        
        <div class="trades-table">
            <h2>📋 Recent Trades</h2>
            <div id="trades-content">Loading trades...</div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                document.getElementById('status').innerHTML = '🔄 Loading data...';
                document.getElementById('status').className = 'status';
                
                // Fetch all data in parallel
                const [tradesRes, riskRes, summaryRes] = await Promise.all([
                    fetch('/api/trades/log'),
                    fetch('/risk_status'),
                    fetch('/api/trades/summary')
                ]);
                
                if (!tradesRes.ok || !riskRes.ok || !summaryRes.ok) {
                    throw new Error('One or more API endpoints failed');
                }
                
                const trades = await tradesRes.json();
                const risk = await riskRes.json();
                const summary = await summaryRes.json();
                
                // Update cards
                document.getElementById('account-value').innerHTML = '$' + risk.account_value.toLocaleString();
                document.getElementById('total-trades').innerHTML = summary.total_trades;
                
                const pnlElement = document.getElementById('total-pnl');
                pnlElement.innerHTML = '$' + summary.total_pnl.toFixed(2);
                pnlElement.className = 'value ' + (summary.total_pnl >= 0 ? 'positive' : 'negative');
                
                document.getElementById('win-rate').innerHTML = summary.win_rate.toFixed(1) + '%';
                
                // Update trades table
                if (trades.length === 0) {
                    document.getElementById('trades-content').innerHTML = 
                        '<p>No trades yet. Run <code>./jj trade</code> to start the simulator.</p>';
                } else {
                    let tableHTML = `
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>Symbol</th>
                                    <th>Signal</th>
                                    <th>Price</th>
                                    <th>VWAP</th>
                                    <th>P&L</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    trades.slice(0, 15).forEach(trade => {
                        const signalClass = trade.signal === 'LONG' ? 'signal-long' : 'signal-short';
                        const pnlClass = trade.pnl >= 0 ? 'positive' : 'negative';
                        
                        tableHTML += `
                            <tr>
                                <td>${trade.timestamp}</td>
                                <td>${trade.symbol}</td>
                                <td class="${signalClass}">${trade.signal}</td>
                                <td>$${trade.last_price}</td>
                                <td>$${trade.vwap}</td>
                                <td class="${pnlClass}">$${trade.pnl.toFixed(2)}</td>
                            </tr>
                        `;
                    });
                    
                    tableHTML += '</tbody></table>';
                    document.getElementById('trades-content').innerHTML = tableHTML;
                }
                
                document.getElementById('status').innerHTML = '✅ Data loaded successfully - Last update: ' + new Date().toLocaleTimeString();
                document.getElementById('status').className = 'status success';
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('status').innerHTML = '❌ Error: ' + error.message;
                document.getElementById('status').className = 'status error';
            }
        }
        
        // Load data on page load
        loadData();
        
        // Auto-refresh every 5 seconds
        setInterval(loadData, 5000);
    </script>
</body>
</html>
