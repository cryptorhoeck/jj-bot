{% extends "base.html" %}
{% block content %}
<div x-data="archiveManager()" class="space-y-6">
    <!-- Upload Section -->
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-2xl font-bold mb-4">Archive Storage</h2>
        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
            <input 
                type="file" 
                @change="handleFileSelect($event)" 
                class="hidden" 
                id="fileInput"
                multiple
            >
            <label for="fileInput" class="cursor-pointer">
                <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-4"></i>
                <p class="text-gray-600">Click to select files or drag and drop</p>
                <p class="text-sm text-gray-500">Store project artifacts, documentation, old versions</p>
            </label>
        </div>
    </div>

    <!-- File List -->
    <div class="bg-white rounded-lg shadow p-6">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-semibold">Archived Files</h3>
            <button @click="loadFiles()" class="btn-secondary">
                <i class="fas fa-sync"></i> Refresh
            </button>
        </div>

        <div x-show="loading" class="text-center py-4">Loading...</div>

        <div x-show="!loading && files.length === 0" class="text-center py-8 text-gray-500">
            No files in archive
        </div>

        <div x-show="!loading && files.length > 0" class="space-y-2">
            <template x-for="file in files" :key="file.name">
                <div class="flex items-center justify-between p-3 border rounded hover:bg-gray-50">
                    <div class="flex items-center">
                        <i class="fas fa-file text-gray-500 w-6"></i>
                        <span class="ml-2 font-medium" x-text="file.name"></span>
                    </div>
                    <div class="flex items-center gap-4 text-sm text-gray-500">
                        <span x-text="formatSize(file.size)"></span>
                        <span x-text="formatDate(file.modified)"></span>
                        <div class="flex gap-1">
                            <button 
                                @click="downloadFile(file.name)"
                                class="text-blue-600 hover:text-blue-800 p-1"
                            >
                                <i class="fas fa-download"></i>
                            </button>
                            <button 
                                @click="deleteFile(file.name)"
                                class="text-red-600 hover:text-red-800 p-1"
                            >
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function archiveManager() {
    return {
        files: [],
        loading: false,

        async init() {
            await this.loadFiles();
        },

        async loadFiles() {
            this.loading = true;
            try {
                const response = await fetch('/api/archive/list');
                const data = await response.json();
                this.files = data.files || [];
            } catch (error) {
                alert('Error loading archive: ' + error.message);
            } finally {
                this.loading = false;
            }
        },

        async handleFileSelect(event) {
            const files = event.target.files;
            if (!files.length) return;

            for (const file of files) {
                await this.uploadFile(file);
            }
            
            // Clear input
            event.target.value = '';
            await this.loadFiles();
        },

        async uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/archive/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if (!result.success) {
                    alert(`Upload failed for ${file.name}: ${result.message}`);
                }
            } catch (error) {
                alert(`Error uploading ${file.name}: ${error.message}`);
            }
        },

        async downloadFile(filename) {
            try {
                const response = await fetch(`/api/archive/download/${encodeURIComponent(filename)}`);
                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(url);
                } else {
                    alert('Download failed');
                }
            } catch (error) {
                alert('Error downloading file: ' + error.message);
            }
        },

        async deleteFile(filename) {
            if (!confirm(`Delete ${filename} from archive?`)) return;

            try {
                const response = await fetch(`/api/archive/delete/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                
                if (result.success) {
                    await this.loadFiles();
                } else {
                    alert('Delete failed: ' + result.message);
                }
            } catch (error) {
                alert('Error deleting file: ' + error.message);
            }
        },

        formatSize(bytes) {
            const sizes = ['B', 'KB', 'MB', 'GB'];
            if (bytes === 0) return '0 B';
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        },

        formatDate(isoString) {
            return new Date(isoString).toLocaleDateString();
        }
    }
}
</script>
{% endblock %}
