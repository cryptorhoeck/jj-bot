<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JJ-Bot Developer Portal{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-blue-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-4">
                    <h1 class="text-xl font-bold">🛠️ JJ-Bot Developer Portal</h1>
                    <span class="text-blue-300 text-sm">Port 8001</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span id="api-status" class="px-2 py-1 rounded text-xs">Checking...</span>
                    <span id="current-time" class="text-sm"></span>
                </div>
            </div>
            
            <!-- Menu -->
            <div class="flex space-x-6 pb-4">
                <a href="/" class="nav-link {% if page == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="/backups" class="nav-link {% if page == 'backups' %}active{% endif %}">
                    <i class="fas fa-save"></i> Backups
                </a>
                <a href="/files" class="nav-link {% if page == 'files' %}active{% endif %}">
                    <i class="fas fa-folder"></i> Files
                </a>
                <a href="/logs" class="nav-link {% if page == 'logs' %}active{% endif %}">
                    <i class="fas fa-file-alt"></i> Logs
                </a>
                <a href="/tools" class="nav-link {% if page == 'tools' %}active{% endif %}">
                <a href="/archive" class="nav-link {% if page == 'archive' %}active{% endif %}">
                    <i class="fas fa-archive"></i> Archive
                </a>
                    <i class="fas fa-tools"></i> Tools
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
